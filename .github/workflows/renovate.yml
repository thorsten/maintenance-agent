name: Renovate

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ vars.MAINT_APP_ID }}
          private-key: ${{ secrets.MAINT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Pin the tag to a fixed version once this is running.
      - name: Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_CONFIG_FILE: /cfg/config.js
          LOG_LEVEL: info
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN -e RENOVATE_PLATFORM -e RENOVATE_CONFIG_FILE -e LOG_LEVEL \
            -v "$PWD/renovate:/cfg:ro" \
            ghcr.io/renovatebot/renovate:latest
